<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktien des Tages</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #14171c; --muted: #646b78; --line: #e3e6eb;
  --accent: #5b5bd6; --rocket: #d9480f; --value: #1c7c54; --good: #1c7c54; --bad: #c92a2a; --chip: #eef0f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #181b21; --text: #e9ebef; --muted: #9aa1ad; --line: #2a2f38;
          --accent: #8b8bff; --rocket: #ff8a4c; --value: #4cc38a; --good: #4cc38a; --bad: #ff6b6b; --chip: #232731; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 14px; }
select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; }
.tabs { display: flex; gap: 8px; margin: 8px 0 18px; overflow-x: auto; }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
       padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; color: var(--muted); }
.intro b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; gap: 12px; align-items: flex-start; }
.top .info { flex: 1; min-width: 0; }
.sym { font-weight: 700; font-size: 18px; }
.name { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price { font-variant-numeric: tabular-nums; font-size: 14px; margin-top: 2px; }
.ring { --c: var(--accent); width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center;
        background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--chip) 0); }
.ring span { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip.new { background: var(--accent); color: #fff; }
.chip.label { color: var(--text); font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.metric { background: var(--chip); border-radius: 8px; padding: 6px 8px; }
.metric small { display: block; color: var(--muted); font-size: 11px; }
.metric b { font-size: 13px; font-variant-numeric: tabular-nums; }
ul { margin: 0; padding-left: 0; list-style: none; font-size: 13.5px; }
li { padding-left: 20px; position: relative; margin: 3px 0; }
li.pro::before { content: "✓"; position: absolute; left: 2px; color: var(--good); font-weight: 700; }
li.con::before { content: "!"; position: absolute; left: 5px; color: var(--bad); font-weight: 700; }
details { font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td, th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.r, th.r { text-align: right; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 50px; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); }
.links a { color: var(--accent); font-size: 13px; text-decoration: none; margin-right: 12px; }
.summary { font-size: 13px; color: var(--muted); }
.table-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; overflow-x: auto; }
.val { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.val-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.val-row small { display: block; color: var(--muted); font-size: 11px; }
.val-row b { font-size: 16px; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); }
.risk { display: inline-block; border-radius: 6px; padding: 0 8px; font-size: 13px !important; font-weight: 700; margin-top: 2px; }
.risk1 { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.risk2 { background: color-mix(in srgb, #e8a400 22%, transparent); color: #b07d00; }
.risk3 { background: color-mix(in srgb, var(--rocket) 20%, transparent); color: var(--rocket); }
.risk4 { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
@media (prefers-color-scheme: dark) { .risk2 { color: #ffc940; } }
.range { position: relative; height: 34px; margin: 4px 6px 0; }
.range .track { position: absolute; top: 8px; left: 0; right: 0; height: 6px; border-radius: 3px; background: var(--chip); }
.range .span { position: absolute; top: 8px; height: 6px; border-radius: 3px; background: var(--c); opacity: .35; }
.range .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--card); }
.range .dot.base { background: var(--c); }
.range .dot.now { background: var(--text); }
.range .lbl { position: absolute; top: 20px; font-size: 10.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12.5px; }
.rules span::before { display: inline-block; width: 16px; font-weight: 700; }
.rules .ok::before { content: "✓"; color: var(--good); }
.rules .no::before { content: "✗"; color: var(--bad); }
.rules .na { color: var(--muted); } .rules .na::before { content: "–"; }
.rules-head { font-size: 12.5px; font-weight: 600; }
.ms { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; }
.ms b { font-size: 13px; }
.stars { color: #e8a400; letter-spacing: 1px; }
.method { font-size: 11.5px; color: var(--muted); }
.search { display: flex; gap: 8px; margin: 0 0 14px; }
.search input { flex: 1; min-width: 0; background: var(--card); color: var(--text); border: 1px solid var(--line);
                border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; }
.search button, .btn { background: var(--text); color: var(--bg); border: 0; border-radius: 10px; padding: 10px 14px;
                font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn.ghost { background: var(--chip); color: var(--text); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.panel h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.style-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: 14px; }
.verdict { font-size: 14.5px; margin: 10px 0 0; }
.kind-head { font-weight: 700; margin: 0 0 6px; font-size: 15px; }
.matches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
           border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
footer { margin-top: 30px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📈 Aktien des Tages</h1>
      <div class="sub" id="stand">Lade Daten …</div>
    </div>
    <label class="sub">Tag: <select id="day"></select></label>
  </header>

  <form id="search" class="search" role="search">
    <input id="q" list="symbols" placeholder="Aktie suchen – Ticker oder Name (z. B. TSM, Nestlé)" autocomplete="off" enterkeyhint="search">
    <datalist id="symbols"></datalist>
    <button type="submit">🔎 Suchen</button>
  </form>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="innovation" aria-selected="true">🚀 Innovation · 10–100-Bagger</button>
    <button class="tab" role="tab" data-tab="buffett" aria-selected="false">🏛️ Buffett-Value</button>
    <button class="tab" role="tab" data-tab="ranking" aria-selected="false">📊 Gesamt-Ranking</button>
    <button class="tab" role="tab" data-tab="suche" aria-selected="false">🔎 Suche</button>
  </nav>

  <div id="intro" class="intro"></div>
  <main id="content"></main>

  <footer>
    Keine Anlageberatung. Die Vorschläge entstehen automatisch aus öffentlich verfügbaren Kennzahlen (Yahoo Finance)
    und einem einfachen Punktesystem. Daten können fehlerhaft oder veraltet sein. Bitte vor jedem Kauf selbst recherchieren.
  </footer>
</div>

<script>
const INTRO = {
  innovation: `<b>Innovations-Aktien mit Vervielfachungs-Potenzial.</b> Bewertet werden starkes Umsatzwachstum,
    skalierbare Margen, eine noch kleine Unternehmensgröße, Gründer-/Insider-Beteiligung, finanzielle Ausdauer,
    Forschungsausgaben, Analysten-Kursziele und Trend. Hohes Risiko – solche Aktien können sich verzehnfachen oder auf null fallen.`,
  buffett: `<b>Qualität zum fairen Preis – nach Warren Buffetts Kriterien.</b> Eigenkapitalrendite Ø ≥ 15 %,
    Gesamtkapitalrendite Ø ≥ 10 %, Bruttomarge ≥ 40 %, Nettomarge ≥ 15 %, stetig steigender Umsatz und Gewinn,
    jedes Jahr positiver Cashflow, KGV ≤ 25 – und eine <b>Sicherheitsmarge</b>: Der Kurs sollte unter dem inneren Wert liegen,
    berechnet aus den <b>Owner Earnings</b> (Gewinn + Abschreibungen − Erhaltungsinvestitionen). Wachstum: 70 % eigene Historie,
    30 % Analysten-Erwartung. Mindestrendite je nach Risiko 8 % (niedrig), 9 % (mittel) oder 10 % (hoch).`,
  suche: `<b>Jede Aktie analysieren.</b> Ticker oder Firmennamen eingeben. Du bekommst beide Bewertungen (Buffett &amp; Innovation),
    die Einstufung (Value, Growth, Qualität …), fairen Wert, Potenzial und Risiko. Aktien aus der täglichen Liste erscheinen sofort,
    alle anderen über <b>„Jetzt bewerten“</b> (dauert ca. 2–3 Minuten).`,
  ranking: `<b>Alle bewerteten Aktien</b> nach Punktzahl. Die Tagesauswahl wird aus den besten 15 jeder Kategorie gezogen
    (gewichtet nach Score) – deshalb wechselt sie täglich, gute Aktien tauchen aber immer wieder auf.
    <br><br><b>Fairer Wert & Potenzial</b> sind grobe Modell-Schätzungen (Buffett: Discounted Cashflow bzw. faires KGV;
    Innovation: 5-Jahres-Umsatzmodell). Sie hängen stark von den Annahmen ab – die Spanne pessimistisch/optimistisch zeigt, wie unsicher sie sind.`,
};
let data = null, tab = "innovation";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPrice = (p, cur) => p == null ? "–" : new Intl.NumberFormat("de-DE", {style: "currency", currency: cur || "USD"}).format(p);
const color = t => t === "buffett" ? "var(--value)" : "var(--rocket)";
const fmtPct = x => x == null ? "–" : `${x >= 0 ? "+" : "−"}${Math.abs(x * 100).toFixed(0)} %`;
const pctClass = x => x == null ? "" : x >= 0 ? "up" : "down";

function morningstar(p) {
  const m = p.morningstar;
  if (!m) return "";
  const stars = m.stars ? `<span class="stars">${"★".repeat(m.stars)}${"☆".repeat(5 - m.stars)}</span>` : "";
  const bits = [m.moat && `Burggraben: ${esc(m.moat)}`, m.uncertainty && `Unsicherheit: ${esc(m.uncertainty)}`,
                m.date && `Stand ${esc(m.date)}`].filter(Boolean).join(" · ");
  const cmp = m.vs_model == null ? "" : `<br>Meine Schätzung liegt <b class="${pctClass(m.vs_model)}">${fmtPct(m.vs_model)}</b> ${m.vs_model >= 0 ? "über" : "unter"} Morningstar.`;
  return `<div class="ms"><b>Morningstar:</b> ${m.fair_value ? `Fairer Wert ${fmtPrice(m.fair_value, p.currency)}
    (<span class="${pctClass(m.potential)}">${fmtPct(m.potential)}</span>)${m.fair_value_original ? ` <span class="sub" style="font-size:11px">= ${esc(m.fair_value_original)}</span>` : ""}` : ""} ${stars}
    ${bits ? `<br><span class="sub" style="font-size:12px">${bits}</span>` : ""}${cmp}</div>`;
}

function rulesBox(p) {
  if (!p.rules) return "";
  const cls = ok => ok === true ? "ok" : ok === false ? "no" : "na";
  return `<div><div class="rules-head">Buffett-Kriterien: ${esc(p.rules_met)} erfüllt</div>
    <div class="rules">${p.rules.map(r => `<span class="${cls(r.ok)}">${esc(r.name)}</span>`).join("")}</div></div>`;
}

function valuation(p) {
  if (p.fair_value == null) {
    return p.risk ? `<div class="val"><div class="val-row"><div><small>Fairer Wert</small><b>–</b></div><div><small>Potenzial</small><b>–</b></div>
      <div><small>Risiko</small><span class="risk risk${p.risk.level}">${esc(p.risk.name)}</span></div></div>
      <div class="method">Für diese Aktie fehlen Daten für eine Wertschätzung.</div></div>` : "";
  }
  const pts = [p.fair_low, p.fair_value, p.fair_high, p.price].filter(v => v != null && v > 0);
  const lo = Math.min(...pts) * 0.9, hi = Math.max(...pts) * 1.05;
  const pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const short = v => fmtPrice(v, p.currency).replace(/,\d\d(?=\s|$)/, "");
  const low = Math.max(p.fair_low ?? 0, lo);
  const r = p.risk || {};
  return `<div class="val">
    <div class="val-row">
      <div><small>Fairer Wert (geschätzt)</small><b>${fmtPrice(p.fair_value, p.currency)}</b></div>
      <div><small>Kurspotenzial</small><b class="${pctClass(p.potential)}">${fmtPct(p.potential)}</b></div>
      <div><small>Risiko</small><span class="risk risk${r.level}">${esc(r.name || "–")}</span></div>
    </div>
    <div class="range" aria-label="Spanne fairer Wert">
      <div class="track"></div>
      ${p.fair_high != null ? `<div class="span" style="left:${pos(low)}%;width:${pos(p.fair_high) - pos(low)}%"></div>` : ""}
      <div class="dot base" style="left:${pos(p.fair_value)}%" title="Fairer Wert"></div>
      <div class="dot now" style="left:${pos(p.price)}%" title="Aktueller Kurs"></div>
      <span class="lbl" style="left:${Math.max(8, Math.min(92, pos(p.price)))}%">● Kurs</span>
    </div>
    ${morningstar(p)}
    <div class="method">
      Pessimistisch ${short(p.fair_low)} (<span class="${pctClass(p.potential_low)}">${fmtPct(p.potential_low)}</span>) ·
      Optimistisch ${short(p.fair_high)} (<span class="${pctClass(p.potential_high)}">${fmtPct(p.potential_high)}</span>)
      ${r.factors?.length ? `<br>Risiko, weil: ${esc(r.factors.join(", "))}` : ""}
      <br>Methode: ${esc(p.valuation_method)}
    </div>
  </div>`;
}

function card(p, kind) {
  const metrics = Object.entries(p.metrics || {}).map(([k, v]) => `<div class="metric"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join("");
  const crit = (p.criteria || []).map(c => `<tr><td>${esc(c.name)}<div class="sub" style="font-size:11px">${esc(c.hint)}</div></td>
      <td>${esc(c.value)}</td><td class="r">${c.points}/${c.max}<div class="bar"><i style="width:${c.max ? c.points / c.max * 100 : 0}%"></i></div></td></tr>`).join("");
  const iv = kind === "buffett" && p.intrinsic_value && p.fair_value == null ? `<span class="chip">Innerer Wert ≈ ${fmtPrice(p.intrinsic_value, p.currency)}</span>` : "";
  return `<article class="card" style="--c:${color(kind)}">
    <div class="top">
      <div class="info">
        <div class="sym">${esc(p.symbol)}</div>
        <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
        <div class="price">${fmtPrice(p.price, p.currency)}</div>
      </div>
      <div class="ring" style="--p:${p.score};--c:${color(kind)}"><span>${p.score}</span></div>
    </div>
    <div class="chips">
      ${p.new_today ? '<span class="chip new">Neu heute</span>' : ""}
      <span class="chip label">${esc(p.label)}</span>
      ${p.theme ? `<span class="chip">${esc(p.theme)}</span>` : p.sector ? `<span class="chip">${esc(p.sector)}</span>` : ""}
      ${iv}
    </div>
    ${valuation(p)}
    ${rulesBox(p)}
    <div class="metrics">${metrics}</div>
    ${p.reasons?.length ? `<ul>${p.reasons.map(r => `<li class="pro">${esc(r)}</li>`).join("")}</ul>` : ""}
    ${p.risks?.length ? `<ul>${p.risks.map(r => `<li class="con">${esc(r)}</li>`).join("")}</ul>` : ""}
    <details><summary>Punkte im Detail</summary>
      <table><tr><th>Kriterium</th><th>Wert</th><th class="r">Punkte</th></tr>${crit}</table>
      ${p.summary ? `<p class="summary">${esc(p.summary)}…</p>` : ""}
    </details>
    <div class="links">
      <a href="https://finance.yahoo.com/quote/${encodeURIComponent(p.symbol)}" target="_blank" rel="noopener">Yahoo Finance ↗</a>
      <a href="https://www.google.com/finance/quote/${encodeURIComponent(p.symbol)}" target="_blank" rel="noopener">Google Finance ↗</a>
    </div>
  </article>`;
}

function rankingTable(list, kind, title) {
  const rows = list.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.symbol)}</b><div class="sub" style="font-size:12px">${esc(r.name)}</div></td>
    <td>${esc(r.label)}</td><td class="r">${fmtPrice(r.price, r.currency)}</td>
    <td class="r">${fmtPrice(r.fair_value, r.currency)}${r.ms_fair_value ? `<div class="sub" style="font-size:11px">MS ${fmtPrice(r.ms_fair_value, r.currency)}</div>` : ""}</td>
    <td class="r ${pctClass(r.potential)}">${fmtPct(r.potential)}</td>
    <td>${r.risk ? `<span class="risk risk${r.risk_level}">${esc(r.risk)}</span>` : "–"}</td>
    ${kind === "buffett" ? `<td class="r">${esc(r.rules_met ?? "–")}</td>` : ""}
    <td class="r" style="--c:${color(kind)}">${r.score}<div class="bar"><i style="width:${r.score}%"></i></div></td></tr>`).join("");
  return `<h3>${title}</h3><div class="table-card"><table>
    <tr><th>#</th><th>Aktie</th><th>Einstufung</th><th class="r">Kurs</th><th class="r">Fairer Wert</th>
    <th class="r">Potenzial</th><th>Risiko</th>${kind === "buffett" ? '<th class="r">Kriterien</th>' : ""}<th class="r">Score</th></tr>${rows}</table></div>`;
}

// ------------------------------------------------------------------ Suche ---
const REPO = "michaelN-blip/App-Aktien";
let searchIndex = null, searchHtml = "", pollTimer = null;
const slug = q => q.toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "LEER";
const norm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

async function loadIndex() {
  if (searchIndex) return searchIndex;
  try {
    searchIndex = (await (await fetch(`data/lookup/index.json?v=${Date.now()}`)).json()).stocks;
  } catch { searchIndex = []; }
  $("#symbols").innerHTML = searchIndex.map(e => `<option value="${esc(e.symbol)}">${esc(e.name)}</option>`).join("");
  return searchIndex;
}

function showSearch(html) { searchHtml = html; tab = "suche"; render(); window.scrollTo({top: 0}); }

async function openAnalysis(file) {
  showSearch(`<div class="panel"><span class="spinner"></span>Lade Analyse …</div>`);
  try {
    const r = await fetch(`data/lookup/${encodeURIComponent(file)}.json?v=${Date.now()}`);
    if (!r.ok) throw new Error(r.status);
    showSearch(analysisView(await r.json()));
  } catch { showSearch(`<div class="panel">Analyse konnte nicht geladen werden.</div>`); }
}

function analysisView(a) {
  const kinds = a.primary === "innovation" ? ["innovation", "buffett"] : ["buffett", "innovation"];
  const head = {buffett: "🏛️ Buffett-Bewertung", innovation: "🚀 Innovations-Bewertung"};
  const d = new Date((a.date || "") + "T12:00:00");
  return `<div class="panel">
      <div class="sub">${esc(a.symbol)} · ${esc(a.sector || "")}${a.industry ? " · " + esc(a.industry) : ""}${a.country ? " · " + esc(a.country) : ""}</div>
      <h2>${esc(a.name)}</h2>
      <div class="price" style="font-size:16px;margin:2px 0 10px">${fmtPrice(a.price, a.currency)}</div>
      <span class="style-badge">${esc(a.style)}</span>
      <div class="chips" style="margin-top:8px">
        ${(a.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}
        ${(a.fits || []).length ? a.fits.map(f => `<span class="chip label">✓ passt zu ${esc(f)}</span>`).join("")
                                : `<span class="chip label">passt zu keiner Strategie</span>`}
      </div>
      <p class="verdict">${esc(a.verdict)}</p>
      ${a.summary ? `<p class="summary">${esc(a.summary)}…</p>` : ""}
      <div class="sub" style="font-size:12px">Bewertet am ${isNaN(d) ? "–" : d.toLocaleDateString("de-DE")} ·
        <a href="#" onclick="requestLookup(${esc(JSON.stringify(a.symbol))});return false">neu bewerten</a></div>
    </div>
    <div class="grid">${kinds.map((k, n) => `<div><p class="kind-head">${head[k]}${n === 0 ? " · passt am besten" : ""}</p>
      ${card({...a[k], new_today: false, ...(n > 0 ? {morningstar: null} : {})}, k)}</div>`).join("")}</div>`;
}

async function doSearch(q) {
  q = q.trim();
  if (!q) return;
  clearInterval(pollTimer);
  const idx = await loadIndex();
  const nq = norm(q);
  const exact = idx.find(e => e.symbol.toLowerCase() === nq);
  if (exact) return openAnalysis(exact.file);
  const hits = idx.filter(e => norm(e.name).includes(nq) || e.symbol.toLowerCase().startsWith(nq));
  if (hits.length === 1) return openAnalysis(hits[0].file);
  const list = hits.slice(0, 12).map(e => `<button class="btn ghost" onclick="openAnalysis(${esc(JSON.stringify(e.file))})">
      <b>${esc(e.symbol)}</b> · ${esc(e.name)}</button>`).join("");
  showSearch(`<div class="panel">
    ${hits.length ? `<b>${hits.length} Treffer</b> in den bereits bewerteten Aktien:<div class="matches">${list}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`
                  : `<b>„${esc(q)}“</b> ist noch nicht bewertet.`}
    <p>Soll ich <b>„${esc(q)}“</b> jetzt bewerten? Es öffnet sich GitHub mit einem fertigen Formular – dort nur auf
      <b>„Create“ / „Submit new issue“</b> tippen. Nach ca. 2–3 Minuten erscheint die Analyse hier automatisch.</p>
    <button class="btn" onclick="requestLookup(${esc(JSON.stringify(q))})">⚡ Jetzt bewerten</button>
    <p class="sub" style="font-size:12px">Tipp: Mit dem Yahoo-Ticker klappt es am zuverlässigsten (z. B. NESN.SW für Nestlé, ALV.DE für Allianz).</p>
  </div>`);
}

function requestLookup(q) {
  const url = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Bewerten: " + q)}`
            + `&body=${encodeURIComponent("Automatische Bewertung aus der Aktien-App. Einfach absenden.")}`;
  window.open(url, "_blank", "noopener");
  const started = Date.now(), key = slug(q);
  const status = () => `<div class="panel"><span class="spinner"></span><b>Bewertung von „${esc(q)}“ läuft …</b>
    <p>Bitte das GitHub-Formular absenden, falls noch nicht geschehen. Diese Seite prüft alle 20 Sekunden,
    ob das Ergebnis da ist (${Math.round((Date.now() - started) / 1000)} s).</p>
    <button class="btn ghost" onclick="clearInterval(pollTimer);doSearch(${esc(JSON.stringify(q))})">Abbrechen</button></div>`;
  showSearch(status());
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (Date.now() - started > 12 * 60 * 1000) {
      clearInterval(pollTimer);
      return showSearch(`<div class="panel">Keine Antwort nach 12 Minuten. Bitte unter GitHub → Actions nachsehen,
        ob „Aktie bewerten (Suche)“ gelaufen ist.</div>`);
    }
    try {
      const r = await fetch(`data/lookup/q/${key}.json?v=${Date.now()}`);
      if (r.ok) {
        const alias = await r.json();
        if (alias.generated_at && new Date(alias.generated_at) >= new Date(started - 2 * 60000)) {
          clearInterval(pollTimer);
          searchIndex = null; loadIndex();
          if (alias.error) return showSearch(`<div class="panel">Zu <b>„${esc(q)}“</b> wurde keine Aktie gefunden.
            Versuch es mit dem Yahoo-Ticker (z. B. NESN.SW, ALV.DE, 7203.T).</div>`);
          return openAnalysis(alias.file);
        }
      }
    } catch {}
    if (tab === "suche") showSearch(status());
  }, 20000);
}

$("#search").onsubmit = e => { e.preventDefault(); $("#q").blur(); doSearch($("#q").value); };
$("#q").addEventListener("focus", loadIndex, {once: true});

function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#intro").innerHTML = INTRO[tab];
  if (tab === "suche") {
    $("#content").innerHTML = searchHtml || `<div class="panel">Gib oben einen Ticker oder Firmennamen ein.</div>`;
    return;
  }
  if (!data) return;
  if (tab === "ranking") {
    $("#content").innerHTML = rankingTable(data.innovation.ranking, "innovation", "🚀 Innovation")
                            + rankingTable(data.buffett.ranking, "buffett", "🏛️ Buffett-Value");
  } else {
    $("#content").innerHTML = `<div class="grid">${data[tab].picks.map(p => card(p, tab)).join("")}</div>`;
  }
}

async function load(file) {
  try {
    const r = await fetch(`data/${file}?v=${Date.now()}`);
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    const d = new Date(data.date + "T12:00:00");
    $("#stand").textContent = `Auswahl vom ${d.toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long", year: "numeric"})}`;
  } catch {
    data = null;
    $("#stand").textContent = "Noch keine Daten";
    $("#content").innerHTML = `<div class="empty">Noch keine Daten vorhanden.<br>
      Starte den GitHub-Workflow <b>„Tägliche Aktien-Vorschläge“</b> (Actions → Run workflow) oder lokal <code>python scanner/scan.py</code>.</div>`;
  }
  render();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$("#day").onchange = e => load(e.target.value === "latest" ? "latest.json" : `history/${e.target.value}.json`);

(async () => {
  try {
    const idx = await (await fetch(`data/index.json?v=${Date.now()}`)).json();
    $("#day").innerHTML = `<option value="latest">Heute / neueste</option>` +
      idx.dates.map(d => `<option value="${esc(d)}">${new Date(d + "T12:00:00").toLocaleDateString("de-DE")}</option>`).join("");
  } catch { $("#day").innerHTML = `<option value="latest">Heute / neueste</option>`; }
  load("latest.json");
})();
</script>
</body>
