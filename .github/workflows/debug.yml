name: Diagnose (temporär)

on:
  push:
    branches: [claude/daily-stock-suggestions-app-e9nfen]
    paths: [.github/workflows/debug.yml]

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rohdaten ausgeben
        run: |
          python - <<'EOF'
          import sys, json
          sys.path.insert(0, "scanner")
          import yfinance as yf, scan, scoring
          for sym in ("GOOGL", "META", "TSM", "KO", "V", "MSFT"):
              t = yf.Ticker(sym); info = t.info
              print("=====", sym)
              s = scan.fetch(sym)
              b = scoring.score_buffett(s)
              print(f"  KURS {s['price']}  FAIR {b['fair_value']:.0f} ({b['potential']:+.0%})  {b['label']} {b['rules_met']}")
              print("  ", b["valuation_method"])
              print("   NI clean:", {y: round(v/1e9, 1) for y, v in s["history"]["net_income"].items()}, "TTM clean:", round((s["net_income_ttm"] or 0)/1e9, 1), "fwd:", s["forward_growth"])
              if sym != "GOOGL":
                  continue
              for k in ("currentPrice", "marketCap", "sharesOutstanding", "impliedSharesOutstanding", "trailingPE", "forwardPE",
                        "trailingEps", "forwardEps", "netIncomeToCommon", "freeCashflow", "operatingCashflow", "totalRevenue",
                        "financialCurrency", "earningsGrowth", "revenueGrowth"):
                  print(f"  {k}: {info.get(k)}")
              inc, cf = t.income_stmt, t.cashflow
              for name, df, rows in (("GuV", inc, ["Total Revenue", "Net Income", "Pretax Income", "Other Non Operating Income Expenses",
                                                  "Gain On Sale Of Security", "Total Unusual Items", "Reconciled Depreciation"]),
                                     ("Cashflow", cf, ["Operating Cash Flow", "Capital Expenditure", "Depreciation And Amortization",
                                                       "Free Cash Flow", "Gain Loss On Investment Securities"])):
                  for r in rows:
                      if r in df.index:
                          print(f"  {name} {r}: " + ", ".join(f"{c.year}={v/1e9:.1f}" for c, v in df.loc[r].items() if v == v))
                      else:
                          print(f"  {name} {r}: FEHLT")
              s = scan.fetch(sym)
              hb = scoring.buffett_history(s)
              print("  history depreciation:", {y: round(v/1e9, 1) for y, v in s["history"]["depreciation"].items()})
              print("  oe_norm:", hb["oe_norm"] / 1e9, "ni_cagr:", hb["ni_cagr"], "rev_cagr:", hb["rev_cagr"])
              b = scoring.score_buffett(s)
              print("  fair:", b["fair_value"], b["valuation_method"])
          EOF
