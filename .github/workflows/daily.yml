name: Tägliche Aktien-Vorschläge

on:
  schedule:
    - cron: "17 5 * * 1-6"   # Di–Sa ~06:17 MEZ, nach US-Börsenschluss des Vortags
  workflow_dispatch:          # manuell starten: Actions -> Run workflow
  push:                       # neu rechnen, wenn du Morningstar-Werte einträgst
    branches: [main]
    paths: [scanner/morningstar.csv]

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aktien-Vorschläge $(date -u +%F)"
          git pull --rebase -X theirs origin main && git push   # bei Konflikt gewinnt der neue Scan
